<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoCapEdit</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-layout" class="app-layout">
        <!-- トップバー（タブと同じ段にボタンを配置） -->
        <div class="top-bar">
            <!-- トップバー左（アイコン） -->
            <div id="icon-bar" class="icon-bar top-bar-left">
                <button id="sidebar-toggle-btn" class="icon-btn" data-i18n-title="tooltip.explorer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="9" y1="3" x2="9" y2="21"></line>
                    </svg>
                </button>
            </div>
            <!-- トップバー右（タブバー） -->
            <div class="tab-bar top-bar-right">
                <div class="tabs-group">
                    <div class="tabs-container" id="tabsContainer"></div>
                    <button class="add-tab-btn" id="addTabBtn" data-i18n-title="tooltip.new_tab">
                        <span class="plus-icon">+</span>
                    </button>
                </div>
                <button class="settings-btn" id="settingsBtn" data-i18n-title="tooltip.settings">
                    <!-- 歯車アイコン -->
                    <svg class="settings-icon gear-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    <!-- 閉じる（✕）アイコン -->
                    <svg class="settings-icon close-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>

        <!-- 下段のメインコンテンツ -->
        <div class="main-content">
            <!-- サイドバー -->
            <div id="sidebar" class="sidebar hidden">
                <div class="sidebar-header" data-i18n="sidebar.header_file"></div>
                <div id="file-tree" class="file-tree"></div>
            </div>
            <!-- リサイズハンドル -->
            <div id="sidebar-resize-handle" class="resize-handle hidden"></div>
            <!-- メインエディタ領域 -->
            <div id="app" class="app-container">
                <!-- エディタエリア -->
                <div class="editor-container">
                    <textarea id="editor" class="editor" data-i18n-placeholder="editor.placeholder"></textarea>
                </div>
        
                <!-- ステータスバー -->
                <div class="status-bar">
                    <span class="status-text" id="statusText" data-i18n="status.initializing"></span>
                    <div class="status-meta">
                <span class="status-metrics" id="statusMetrics">Ln 1, Col 1 | 0 chars</span>
            </div>
        </div>
    </div>
    </div>

    <!-- 設定ダイアログ -->
    <div id="settingsDialog" class="dialog-overlay hidden">
        <div class="dialog-box">
            <h2 data-i18n="settings.dialog_title"></h2>
            <div class="dialog-content">
                <div id="updateNoticeContainer" class="update-notice hidden">
                    <p><span data-i18n="settings.update_available"></span><br>Ver. <span id="currentVerSpan"></span> → Ver. <span id="latestVerSpan"></span></p>
                    <a href="#" id="releaseLink" data-i18n="settings.open_release_notes"></a>
                </div>

                <label for="homeFolderInput" data-i18n="settings.home_folder_label"></label>
                <small id="folderHint" class="hint"></small>
                <div class="folder-input-group">
                    <input type="text" id="homeFolderInput" class="folder-input" readonly>
                    <button id="browseFolderBtn" class="browse-btn" data-i18n="settings.button_browse"></button>
                </div>

                <label for="fontFamilySelectModal" data-i18n="settings.font_label"></label>
                <select id="fontFamilySelectModal" class="font-select" data-i18n-title="tooltip.change_font">
                    <option value="default" data-i18n="settings.font_default"></option>
                </select>

                <label for="tabBehaviorSelectModal" data-i18n="settings.tab_behavior_label"></label>
                <select id="tabBehaviorSelectModal" class="tab-select" data-i18n-title="tooltip.change_tab_behavior">
                    <option value="tab" data-i18n="settings.tab_char"></option>
                    <option value="space2" data-i18n="settings.space2"></option>
                    <option value="space4" data-i18n="settings.space4"></option>
                </select>

                <label for="saveModeSelectModal" data-i18n="settings.save_mode_label"></label>
                <select id="saveModeSelectModal" class="tab-select" data-i18n-title="tooltip.change_save_mode">
                    <option value="auto" data-i18n="settings.save_auto"></option>
                    <option value="manual" data-i18n="settings.save_manual"></option>
                </select>

                <label for="charCountModeSelectModal" data-i18n="settings.char_count_label"></label>
                <select id="charCountModeSelectModal" class="tab-select" data-i18n-title="tooltip.change_char_count">
                    <option value="with_newline" data-i18n="settings.char_count_with_newline"></option>
                    <option value="no_newline" data-i18n="settings.char_count_no_newline"></option>
                </select>

                <label for="themeSelectModal" data-i18n="settings.theme_label"></label>
                <select id="themeSelectModal" class="tab-select" data-i18n-title="tooltip.change_theme">
                    <option value="dark" data-i18n="settings.theme_dark"></option>
                    <option value="soft-dark" data-i18n="settings.theme_soft_dark"></option>
                    <option value="light" data-i18n="settings.theme_light"></option>
                </select>

                <label for="simpleModeSelectModal" data-i18n="settings.mode_label"></label>
                <select id="simpleModeSelectModal" class="tab-select" data-i18n-title="tooltip.change_mode">
                    <option value="false" data-i18n="settings.mode_full"></option>
                    <option value="true" data-i18n="settings.mode_simple"></option>
                </select>
            </div>
        </div>
    </div>

    <!-- 保存失敗ダイアログ -->
    <div id="errorDialog" class="dialog-overlay hidden">
        <div class="dialog-box">
            <h2 data-i18n="dialog.error_title"></h2>
            <div class="dialog-content">
                <p id="errorMessage"></p>
            </div>
            <div class="dialog-actions">
                <button id="retryBtn" class="btn-secondary" data-i18n="dialog.button.retry"></button>
                <button id="saveAsBtn" class="btn-secondary" data-i18n="dialog.button.save_as"></button>
                <button id="cancelExitBtn" class="btn-primary" data-i18n="dialog.button.cancel"></button>
            </div>
        </div>
    </div>

    <!-- カスタムコンテキストメニュー -->
    <div id="contextMenu" class="context-menu hidden">
        <div class="context-menu-item" id="menuNewFile" data-i18n="context_menu.new_file"></div>
        <div class="context-menu-item" id="menuNewFolder" data-i18n="context_menu.new_folder"></div>
        <div class="context-menu-item" id="menuRename" data-i18n="context_menu.rename"></div>
        <div class="context-menu-item" id="menuDelete" data-i18n="context_menu.delete"></div>
    </div>

    <script src="i18n.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
