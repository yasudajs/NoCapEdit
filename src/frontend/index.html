<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoCapEdit</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="app-container">
        <!-- タブバー -->
        <div class="tab-bar">
            <div class="tabs-group">
                <div class="tabs-container" id="tabsContainer"></div>
                <button class="add-tab-btn" id="addTabBtn" title="新規タブを作成" data-i18n-title="ui.tooltip.addTab">
                    <span class="plus-icon">+</span>
                </button>
            </div>
            <button class="settings-btn" id="settingsBtn" title="設定" data-i18n-title="ui.tooltip.settings">
                <!-- 歯車アイコン -->
                <svg class="settings-icon gear-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <!-- 閉じる（✕）アイコン -->
                <svg class="settings-icon close-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- エディタエリア -->
        <div class="editor-container">
            <div id="editor" class="editor"></div>

            <!-- 検索・置換ウィジェット -->
            <div id="findReplaceWidget" class="find-replace-widget hidden">
                <div class="find-row">
                    <div class="input-with-options">
                        <input type="text" id="findInput" class="find-input" placeholder="検索" data-i18n-placeholder="ui.find.placeholder" autocomplete="off" spellcheck="false">
                        <button id="matchCaseBtn" class="toggle-btn" title="大文字/小文字を区別 (Alt+C)" data-i18n-title="ui.find.matchCase">Aa</button>
                    </div>
                    <span id="findMatchCount" class="match-count">0 / 0</span>
                    <button id="findPrevBtn" class="icon-btn" title="前を検索 (Shift+Enter)" data-i18n-title="ui.find.prev">▲</button>
                    <button id="findNextBtn" class="icon-btn" title="次を検索 (Enter)" data-i18n-title="ui.find.next">▼</button>
                    <button id="closeFindBtn" class="icon-btn" title="閉じる (Esc)" data-i18n-title="ui.find.close">✕</button>
                </div>
                <div id="replaceRow" class="replace-row hidden">
                    <input type="text" id="replaceInput" class="replace-input" placeholder="置換" data-i18n-placeholder="ui.find.replacePlaceholder" autocomplete="off" spellcheck="false">
                    <button id="replaceOneBtn" class="action-btn" title="置換 (Enter)" data-i18n="ui.find.replace">置換</button>
                    <button id="replaceAllBtn" class="action-btn" title="すべて置換 (Alt+A)" data-i18n="ui.find.replaceAll">すべて置換</button>
                </div>
            </div>
        </div>

        <!-- ステータスバー -->
        <div class="status-bar">
            <span class="status-text" id="statusText" data-i18n="status.initializing">準備中...</span>
            <div class="status-meta">
                <span class="status-metrics" id="statusMetrics">Ln 1, Col 1 | 0 chars</span>
            </div>
        </div>
    </div>

    <!-- 設定ダイアログ -->
    <div id="settingsDialog" class="dialog-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settingsDialogTitle">
        <div class="dialog-box">
            <h2 id="settingsDialogTitle" data-i18n="ui.dialog.settings.title">NoCapEdit - 設定</h2>
            <div class="dialog-content">
                <div id="updateNoticeContainer" class="update-notice hidden">
                    <p><span data-i18n="ui.dialog.settings.update.available">アップデート可能です:</span><br>Ver. <span id="currentVerSpan"></span> → Ver. <span id="latestVerSpan"></span></p>
                    <a href="#" id="releaseLink" data-i18n="ui.dialog.settings.update.releaseNotes">リリースノートを開く</a>
                </div>

                <label for="homeFolderInput" data-i18n="ui.dialog.settings.folder.label">ホームフォルダ:</label>
                <small id="folderHint" class="hint"></small>
                <div class="folder-input-group">
                    <input type="text" id="homeFolderInput" class="folder-input" readonly>
                    <button id="browseFolderBtn" class="browse-btn" data-i18n="ui.dialog.settings.folder.browse">参照...</button>
                </div>

                <label for="fontFamilySelectModal" data-i18n="ui.dialog.settings.font.label">フォント:</label>
                <select id="fontFamilySelectModal" class="font-select" title="フォントを変更" data-i18n-title="ui.tooltip.fontSelect">
                    <option value="default" data-i18n="ui.dialog.settings.font.default">デフォルト (Monospace)</option>
                </select>

                <label for="fontSizeSelectModal" data-i18n="ui.dialog.settings.fontSize.label">フォントサイズ:</label>
                <select id="fontSizeSelectModal" class="settings-select" title="フォントサイズを変更" data-i18n-title="ui.tooltip.fontSize">
                    <option value="8">8 pt</option>
                    <option value="9">9 pt</option>
                    <option value="10">10 pt</option>
                    <option value="11">11 pt</option>
                    <option value="12">12 pt</option>
                    <option value="13">13 pt</option>
                    <option value="14">14 pt</option>
                    <option value="15">15 pt</option>
                    <option value="16">16 pt</option>
                    <option value="17">17 pt</option>
                    <option value="18">18 pt</option>
                    <option value="19">19 pt</option>
                    <option value="20" selected data-i18n="ui.dialog.settings.fontSize.defaultOption">20 pt (デフォルト)</option>
                    <option value="21">21 pt</option>
                    <option value="22">22 pt</option>
                    <option value="24">24 pt</option>
                    <option value="26">26 pt</option>
                    <option value="28">28 pt</option>
                    <option value="32">32 pt</option>
                    <option value="36">36 pt</option>
                    <option value="40">40 pt</option>
                    <option value="48">48 pt</option>
                    <option value="56">56 pt</option>
                    <option value="64">64 pt</option>
                    <option value="72">72 pt</option>
                </select>

                <label for="lineHeightSelectModal" data-i18n="ui.dialog.settings.lineHeight.label">行間:</label>
                <select id="lineHeightSelectModal" class="settings-select" title="行間を変更" data-i18n-title="ui.tooltip.lineHeight">
                    <option value="1.0">1.0</option>
                    <option value="1.1">1.1</option>
                    <option value="1.2">1.2</option>
                    <option value="1.3">1.3</option>
                    <option value="1.4">1.4</option>
                    <option value="1.5" selected data-i18n="ui.dialog.settings.lineHeight.defaultOption">1.5 (デフォルト)</option>
                    <option value="1.6">1.6</option>
                    <option value="1.7">1.7</option>
                    <option value="1.8">1.8</option>
                    <option value="1.9">1.9</option>
                    <option value="2.0">2.0</option>
                    <option value="2.2">2.2</option>
                    <option value="2.5">2.5</option>
                    <option value="2.8">2.8</option>
                    <option value="3.0">3.0</option>
                </select>

                <label for="tabBehaviorSelectModal" data-i18n="ui.dialog.settings.tabBehavior.label">Tabキーの挙動:</label>
                <select id="tabBehaviorSelectModal" class="settings-select" title="Tabキーの挙動を変更" data-i18n-title="ui.tooltip.tabBehavior">
                    <option value="tab" data-i18n="ui.dialog.settings.tabBehavior.tab">タブ文字 (\t)</option>
                    <option value="space2" data-i18n="ui.dialog.settings.tabBehavior.space2">スペース 2文字</option>
                    <option value="space4" data-i18n="ui.dialog.settings.tabBehavior.space4">スペース 4文字</option>
                </select>

                <label for="saveModeSelectModal" data-i18n="ui.dialog.settings.saveMode.label">保存モード:</label>
                <select id="saveModeSelectModal" class="settings-select" title="保存モードを変更" data-i18n-title="ui.tooltip.saveMode">
                    <option value="auto" data-i18n="ui.dialog.settings.saveMode.auto">自動保存（推奨）</option>
                    <option value="manual" data-i18n="ui.dialog.settings.saveMode.manual">手動保存(Ctrl+Sで保存)</option>
                </select>

                <label for="charCountModeSelectModal" data-i18n="ui.dialog.settings.charCount.label">文字数カウント:</label>
                <select id="charCountModeSelectModal" class="settings-select" title="文字数カウント方法を変更" data-i18n-title="ui.tooltip.charCount">
                    <option value="with_newline" data-i18n="ui.dialog.settings.charCount.withNewline">改行を含む（デフォルト）</option>
                    <option value="no_newline" data-i18n="ui.dialog.settings.charCount.noNewline">文字数のみ（改行を除く）</option>
                </select>

                <label for="wordWrapSelectModal" data-i18n="ui.dialog.settings.wordWrap.label">行の折り返し:</label>
                <select id="wordWrapSelectModal" class="settings-select" title="行の折り返しを変更" data-i18n-title="ui.tooltip.wordWrap">
                    <option value="true" data-i18n="ui.dialog.settings.wordWrap.on">有効（折り返す）</option>
                    <option value="false" data-i18n="ui.dialog.settings.wordWrap.off">無効（折り返さない）</option>
                </select>

                <label for="themeSelectModal" data-i18n="ui.dialog.settings.theme.label">テーマ:</label>
                <select id="themeSelectModal" class="settings-select" title="テーマを変更" data-i18n-title="ui.tooltip.theme">
                    <option value="dark" data-i18n="ui.dialog.settings.theme.dark">ダーク</option>
                    <option value="soft-dark" data-i18n="ui.dialog.settings.theme.softDark">ソフトダーク</option>
                    <option value="light" data-i18n="ui.dialog.settings.theme.light">ライト</option>
                </select>
            </div>
            <div class="settings-footer" data-i18n="ui.dialog.settings.footerHint">💡 Tab: 項目移動 │ ↑↓: 選択 │ Space: 実行 │ Esc: 閉じる</div>
        </div>
    </div>

    <!-- 保存失敗ダイアログ -->
    <div id="errorDialog" class="dialog-overlay hidden">
        <div class="dialog-box">
            <h2 data-i18n="ui.dialog.error.title">エラー</h2>
            <div class="dialog-content">
                <p id="errorMessage"></p>
            </div>
            <div class="dialog-actions">
                <button id="retryBtn" class="btn-secondary" data-i18n="ui.dialog.error.retry">再試行</button>
                <button id="saveAsBtn" class="btn-secondary" data-i18n="ui.dialog.error.saveAs">別名で保存</button>
                <button id="cancelExitBtn" class="btn-primary" data-i18n="ui.dialog.error.cancel">キャンセル</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
